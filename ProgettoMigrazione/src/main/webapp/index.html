<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Migration Service</title>
    <link rel="stylesheet" href="stile.css">
    <script src="funzioni.js" defer></script>
</head>
<body>
    <main class="scheda-migrazione">
        <header class="intestazione-principale">
            <h1>Server Migration Service</h1>
        </header>

        <section class="intestazione-colonne">
            <div class="col-tabelle">Tabelle</div>
            <div class="col-stato">Stato</div>
            <div class="col-operazioni">Operazioni</div>
        </section>

        <section class="corpo-scheda">
            <div class="col-tabelle">
                <div class="riga-tabella">Clienti</div>
                <div class="riga-tabella">Fatture</div>
                <div class="riga-tabella">Utenze</div>
                <div class="riga-tabella">Letture</div>
            </div>

            <div class="col-stato">
                <div class="riga-progresso">
                    <div class="barra-contenitore">
                        <div id="bar-CLIENTI" class="barra-riempimento"></div>
                    </div>
                    <span id="pct-CLIENTI" class="testo-percentuale">0%</span>
                </div>

                <div class="riga-progresso">
                    <div class="barra-contenitore">
                        <div id="bar-FATTURE" class="barra-riempimento"></div>
                    </div>
                    <span id="pct-FATTURE" class="testo-percentuale">0%</span>
                </div>

                <div class="riga-progresso">
                    <div class="barra-contenitore">
                        <div id="bar-UTENZE" class="barra-riempimento"></div>
                    </div>
                    <span id="pct-UTENZE" class="testo-percentuale">0%</span>
                </div>

                <div class="riga-progresso">
                    <div class="barra-contenitore">
                        <div id="bar-LETTURE" class="barra-riempimento"></div>
                    </div>
                    <span id="pct-LETTURE" class="testo-percentuale">0%</span>
                </div>

            </div>

            <div class="col-operazioni">
                <button id="btn-trasferisci" type="button">
                    Trasferisci
                </button>
                <p id="stato-generale" class="info-stato">In attesa di avvio</p>
            </div>
        </section>
    </main>

    <div id="box-errore" class="errore-banner" hidden></div>
</body>
</html>
